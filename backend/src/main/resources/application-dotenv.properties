# Perfil "dotenv": lê as chaves do agente de IA de um arquivo .env que NUNCA vai para o Git (está no .gitignore).
# Ative com o perfil "dotenv" (IntelliJ: Active profiles = dotenv; terminal: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dotenv).
# Os testes não usam este perfil, então nunca leem a sua chave nem chamam a API de verdade.
# Funciona rodando de dentro de backend/ ou da raiz do repositório.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
