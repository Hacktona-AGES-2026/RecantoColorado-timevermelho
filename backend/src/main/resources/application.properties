spring.application.name=filaviva
server.port=${PORT:8080}

# Lê backend/.env sozinho, se existir (só a chave da IA fica lá; o arquivo nunca vai para o Git).
# Funciona rodando de dentro de backend/ ou da raiz do repositório, pelo terminal ou pelo IntelliJ.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Banco: por padrão, H2 em memória (roda direto, sem Docker; o dataset é reimportado a cada subida).
# Para usar o PostgreSQL do docker-compose: docker compose up -d db e defina
#   DB_URL=jdbc:postgresql://localhost:5432/filaviva  DB_USER=filaviva  DB_PASSWORD=filaviva
spring.datasource.url=${DB_URL:jdbc:h2:mem:filaviva;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Recria o schema e reimporta o dataset a cada boot (simples e previsível para a demo)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500

# Pasta com os CSVs do desafio (relativa à pasta backend/)
app.dataset.dir=${DATASET_DIR:../data}
# Data de referência do dataset (todos os dias_em_fila foram calculados a partir dela)
app.data-referencia=2026-10-23

# Front Next.js em desenvolvimento. O navegador fala com o backend pelo próprio Next (proxy em /api),
# então o CORS só importa para quem chamar a API direto; vale qualquer porta de localhost e 127.0.0.1.
app.cors.origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

management.endpoints.web.exposure.include=health,info

# Grava o entregável comum ao subir (relativo à pasta backend/). Deixe vazio para não gravar.
app.export.arquivo=${EXPORT_ARQUIVO:../fila_priorizada.csv}

# ---------- Agente de IA (chatbot) ----------
# Modelo, esforço e endereço já ficam aqui. Só a CHAVE fica fora do código: em backend/.env (lido sozinho, veja
# backend/.env.example) ou numa variável de ambiente. Provedor sem chave é ignorado.
# Qualquer API no formato chat/completions da OpenAI serve. A ordem abaixo é a ordem de preferência:
# quando o crédito de um acaba, o agente passa sozinho para o próximo.
agente.ativo=${AGENTE_ATIVO:true}
# Sem regras de negócio preenchidas (resources/agente/regras-negocio.md) o agente fica desligado.
agente.exigir-regras=${AGENTE_EXIGIR_REGRAS:true}
agente.moderacao-ativa=true
agente.timeout-segundos=30
agente.max-tokens=1500

agente.provedores[0].nome=openai-1
agente.provedores[0].base-url=${IA_PROVEDOR_1_URL:https://api.openai.com/v1}
agente.provedores[0].chave=${IA_PROVEDOR_1_CHAVE:}
agente.provedores[0].modelo=${IA_PROVEDOR_1_MODELO:gpt-6.1-sol}
agente.provedores[0].esforco-raciocinio=${IA_PROVEDOR_1_ESFORCO:medium}

# Reserva: assume quando o crédito do 1º acabar. Pode ser outra conta (outra chave) com o mesmo modelo.
agente.provedores[1].nome=openai-2
agente.provedores[1].base-url=${IA_PROVEDOR_2_URL:https://api.openai.com/v1}
agente.provedores[1].chave=${IA_PROVEDOR_2_CHAVE:}
agente.provedores[1].modelo=${IA_PROVEDOR_2_MODELO:gpt-6.1-sol}
agente.provedores[1].esforco-raciocinio=${IA_PROVEDOR_2_ESFORCO:medium}

agente.limites.mensagens-por-minuto=10
agente.limites.max-mensagem=1000
