spring.application.name=filaviva
server.port=${PORT:8080}

# Banco: sobe com "docker compose up -d db" na raiz do repositório
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/filaviva}
spring.datasource.username=${DB_USER:filaviva}
spring.datasource.password=${DB_PASSWORD:filaviva}

# Recria o schema e reimporta o dataset a cada boot (simples e previsível para a demo)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500

# Pasta com os CSVs do desafio (relativa à pasta backend/)
app.dataset.dir=${DATASET_DIR:../data}
# Data de referência do dataset (todos os dias_em_fila foram calculados a partir dela)
app.data-referencia=2026-10-23

# Front Next.js em desenvolvimento
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info

# Grava o entregável comum ao subir (relativo à pasta backend/). Deixe vazio para não gravar.
app.export.arquivo=${EXPORT_ARQUIVO:../fila_priorizada.csv}

# ---------- Agente de IA (chatbot) ----------
# As chaves entram SÓ por variável de ambiente (veja backend/.env.example). Provedor sem chave é ignorado.
# Qualquer API no formato chat/completions da OpenAI serve. A ordem abaixo é a ordem de preferência:
# quando o crédito de um acaba, o agente passa sozinho para o próximo.
agente.ativo=${AGENTE_ATIVO:true}
# Sem regras de negócio preenchidas (resources/agente/regras-negocio.md) o agente fica desligado.
agente.exigir-regras=${AGENTE_EXIGIR_REGRAS:true}
agente.moderacao-ativa=true
agente.timeout-segundos=30
agente.max-tokens=1500

agente.provedores[0].nome=openai-1
agente.provedores[0].base-url=${IA_PROVEDOR_1_URL:https://api.openai.com/v1}
agente.provedores[0].chave=${IA_PROVEDOR_1_CHAVE:}
agente.provedores[0].modelo=${IA_PROVEDOR_1_MODELO:}
agente.provedores[0].esforco-raciocinio=${IA_PROVEDOR_1_ESFORCO:}

agente.provedores[1].nome=openai-2
agente.provedores[1].base-url=${IA_PROVEDOR_2_URL:https://api.openai.com/v1}
agente.provedores[1].chave=${IA_PROVEDOR_2_CHAVE:}
agente.provedores[1].modelo=${IA_PROVEDOR_2_MODELO:}
agente.provedores[1].esforco-raciocinio=${IA_PROVEDOR_2_ESFORCO:}

agente.limites.mensagens-por-minuto=10
agente.limites.max-mensagem=1000
