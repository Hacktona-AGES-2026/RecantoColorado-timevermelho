# FilaVIVA em produção (uma máquina, ex.: EC2). Uso, na raiz do repositório:
#   docker compose -f docker-compose.prod.yml up -d --build
# Abre em http://<endereço da máquina>/ . Só o frontend fica exposto (porta 80); ele repassa /api para o backend.
# A chave da IA vem de backend/.env (copie backend/.env.example). Sem o arquivo, o agente fica desligado e o resto funciona.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: filaviva-backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      # o navegador chama /api no próprio endereço do site (ex.: http://18.218.2.12) e o Next repassa para cá com
      # esse Origin; sem isto o backend responde 403 "Invalid CORS request" a todo POST (chat, eventos, decisões).
      # O backend não fica exposto (só o frontend, na porta 80) e a API não usa cookies, então qualquer origem serve.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    restart: unless-stopped
    # banco H2 em memória: o dataset é reimportado a cada subida (igual ao modo local da demo)

  frontend:
    build:
      context: frontend
      args:
        BACKEND_URL: http://backend:8080
    image: filaviva-frontend
    depends_on:
      - backend
    ports:
      - "${PORTA:-80}:3000"
    restart: unless-stopped
